# Dummy help text for the information icons shown next to properties on the
# dataset detail view in the GDI User Portal frontend. Content here is
# placeholder only — see README.md in this folder for how this file is
# consumed and where the real copy should come from. Loaded by the Discovery
# Service's YamlHelpTextLoader when `helptext.dataset-source` is configured
# (local file path or http(s) URL). Keys are Discovery API dataset property
# names (see RetrievedDataset.helpText in discovery.yaml).
#
# Shape per key:
#   <key>:
#     text:                  # required, per language (falls back to "en")
#       en: "..."
#       nl: "..."
#     link:                  # optional; omit entirely if there is no link
#       label: ...           # see accepted shapes below
#       value:               # required if "link" is present; always a list
#         - "https://example.com"
#
# `link.label` is always keyed by language code (falls back to "en"); each
# language's value may be a single string or a list of strings:
#   - a language-code map to a single string:
#       label:
#         en: "More info"
#         nl: "Meer info"
#   - a language-code map to a list of strings:
#       label:
#         en: ["More info", "Even more info"]
#         nl: ["Meer info", "Nog meer info"]
# `link.value` is always a plain list of URLs (no language variants).
# If, once resolved for a language, `label` and `value` differ in length, the
# shorter one is padded automatically with a dummy entry ("More info" / "#").
#
# Keys derive from the property/scope spreadsheet (properties marked "yes" or
# "yes, detailed view"). Where a property doesn't share its spreadsheet label
# with the actual Discovery API property name, the mapping used is noted
# inline (see DatasetHelpTextService.SCHEMING_FIELD_TO_DATASET_PROPERTY):
#   - "code values"           -> codeValues
#   - "coding system"         -> codingSystem
#   - "conforms to"           -> conformsTo
#   - "contact point"         -> contacts
#   - "creator"               -> creators
#   - "distribution"          -> distributions
#   - "geographical coverage" -> spatialCoverage
#   - "has version"           -> hasVersions
#   - "health theme"          -> healthTheme
#   - "in series"             -> inSeries
#   - "is referenced by"      -> isReferencedBy
#   - "keyword"               -> keywords
#   - "language"              -> languages
#   - "legal basis"           -> legalBasis
#   - "maximum typical age"   -> maxTypicalAge
#   - "minimum typical age"   -> minTypicalAge
#   - "modification date"     -> modifiedAt
#   - "number of records"     -> numberOfRecords
#   - "number of unique individuals" -> numberOfUniqueIndividuals
#   - "other identifier"      -> alternateIdentifier
#   - "personal data"         -> personalData
#   - "population coverage"   -> populationCoverage
#   - "publisher"             -> publishers
#   - "qualified attribution" -> qualifiedAttribution
#   - "qualified relation"    -> qualifiedRelation
#   - "quality annotation"    -> qualityAnnotation
#   - "release date"          -> createdAt (issued)
#   - "retention period"      -> retentionPeriod
#   - "sample"                -> samples
#   - "temporal coverage"     -> temporalCoverage
#   - "temporal resolution"   -> temporalResolution
#   - "theme"                 -> themes
#   - "type"                  -> dcatType
#   - "version notes"         -> versionNotes
#   - "was generated by"      -> provenanceActivity

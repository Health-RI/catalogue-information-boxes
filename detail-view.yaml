# Dummy help text for the information icons shown next to properties on the
# dataset detail view in the GDI User Portal frontend. Content here is
# placeholder only — see README.md in this folder for how this file is
# consumed and where the real copy should come from. Loaded by the Discovery
# Service's YamlHelpTextLoader when `helptext.dataset-source` is configured
# (local file path or http(s) URL). Keys are Discovery API dataset property
# names (see RetrievedDataset.helpText in discovery.yaml).
#
# Shape per key:
#   <key>:
#     text:                  # required, per language (falls back to "en")
#       en: "..."
#       nl: "..."
#     link:                  # optional; omit entirely if there is no link
#       label: ...           # see accepted shapes below
#       value:               # required if "link" is present; always a list
#         - "https://example.com"
#
# `link.label` is always keyed by language code (falls back to "en"); each
# language's value may be a single string or a list of strings:
#   - a language-code map to a single string:
#       label:
#         en: "More info"
#         nl: "Meer info"
#   - a language-code map to a list of strings:
#       label:
#         en: ["More info", "Even more info"]
#         nl: ["Meer info", "Nog meer info"]
# `link.value` is always a plain list of URLs (no language variants).
# If, once resolved for a language, `label` and `value` differ in length, the
# shorter one is padded automatically with a dummy entry ("More info" / "#").
#
# Keys derive from the property/scope spreadsheet (properties marked "yes" or
# "yes, detailed view"). Where a property doesn't share its spreadsheet label
# with the actual Discovery API property name, the mapping used is noted
# inline (see DatasetHelpTextService.SCHEMING_FIELD_TO_DATASET_PROPERTY):
#   - "code values"           -> codeValues
#   - "coding system"         -> codingSystem
#   - "conforms to"           -> conformsTo
#   - "contact point"         -> contacts
#   - "creator"               -> creators
#   - "distribution"          -> distributions
#   - "geographical coverage" -> spatialCoverage
#   - "has version"           -> hasVersions
#   - "health theme"          -> healthTheme
#   - "in series"             -> inSeries
#   - "is referenced by"      -> isReferencedBy
#   - "keyword"               -> keywords
#   - "language"              -> languages
#   - "legal basis"           -> legalBasis
#   - "maximum typical age"   -> maxTypicalAge
#   - "minimum typical age"   -> minTypicalAge
#   - "modification date"     -> modifiedAt
#   - "number of records"     -> numberOfRecords
#   - "number of unique individuals" -> numberOfUniqueIndividuals
#   - "other identifier"      -> alternateIdentifier
#   - "personal data"         -> personalData
#   - "population coverage"   -> populationCoverage
#   - "publisher"             -> publishers
#   - "qualified attribution" -> qualifiedAttribution
#   - "qualified relation"    -> qualifiedRelation
#   - "quality annotation"    -> qualityAnnotation
#   - "release date"          -> createdAt (issued)
#   - "retention period"      -> retentionPeriod
#   - "sample"                -> samples
#   - "temporal coverage"     -> temporalCoverage
#   - "temporal resolution"   -> temporalResolution
#   - "theme"                 -> themes
#   - "type"                  -> dcatType
#   - "version notes"         -> versionNotes
#   - "was generated by"      -> provenanceActivity
accessRights:
  text:
    en: |-
      Indicates the access level of the Dataset.
      There are three main access rights categories:
      • Public: Non-personal health data openly accessible to everyone, without restrictions (e.g : open data).
      • Restricted: Non-personal health data accessible only under specific conditions (e.g. licence, registration, agreement).
      • Non-public: Personal health data not openly accessible, available only through a Health Data Access Body under EHDS rules.
    nl: |-
      Het toegangslevel van de dataset.
      Er zijn drie levels voor toegangsrechten:
      • Openbaar: Niet-persoonlijke gezondheidsgegevens die vrij toegankelijk zijn, zonder beperkingen (bijv. open data).
      • Beperkt: Niet-persoonlijke gezondheidsgegevens die alleen onder specifieke voorwaarden toegankelijk zijn (bijv. licentie, registratie, overeenkomst).
      • Niet-openbaar: Persoonlijke gezondheidsgegevens die niet vrij toegankelijk zijn en alleen via een HDAB beschikbaar zijn onder de EHDS-regels.
analytics:
  text:
    en: "Points to a type of Distribution where users can access or request associated resources such as technical reports of the dataset, quality measurements, usability indicators, etc."
    nl: "Verwijst naar een type distributie waar gebruikers toegang hebben (of aan kunnen vragen) tot gerelateerde bronnen zoals technische rapporten, kwaliteitsmetingen en bruikbaarheidsindicatoren."
codeValues:
  text:
    en: "A free-text description containing the code values of the coding systems used that apply to the Dataset (e.g. U07.1, Y59.0)."
    nl: "Vrije tekst beschrijving van relevante codewaarden uit codesystemen die in de dataset gebruikt worden (bijv. U07.1, Y59.0)."
codingSystem:
  text:
    en: "Codingsystems (like ICD-10 or SNOMED CT) used to encode values inside the Dataset."
    nl: "Codesystemen die in de dataset gebruikt worden om waardes te coderen, bijvoorbeeld ICD-10 of SNOMED CT."
conformsTo:
  text:
    en: "Standards that the Dataset conforms to, like DICOM, HL7 FHIR or OMOP CDM. Describes how the data is structured."
    nl: "Standaarden waar de dataset aan voldoet, zoals DICOM, HL7 FHIR of OMOP CDM. Beschrijft hoe de dataset gestructureerd is."
contacts:
  text:
    en: "The contact point (department or organisation) that can answer questions about the Dataset."
    nl: "Het primaire contactpunt (afdeling of organisatie) dat vragen over de dataset kan beantwoorden."
creators:
  text:
    en: "The entity responsible for creating the Dataset."
    nl: "De organisatie(s) verantwoordelijk voor het creëren van de dataset."
description:
  text:
    en: "Brief description of the Dataset."
    nl: "Korte beschrijving van de dataset."
distributions:
  text:
    en: "An available Distribution for the Dataset."
    nl: "Een beschikbare distributie van de dataset."
frequency:
  text:
    en: "Information on update frequency (for example, daily, monthly, or annually) of the data in the Dataset."
    nl: "Informatie over de update frequentie (dagelijks, maandelijks of jaarlijks) van de data in de dataset."
spatialCoverage:
  text:
    en: "A geographic region that is covered by the Dataset."
    nl: "De geografische regio die door de dataset gedekt wordt."
hasVersions:
  text:
    en: "A related Dataset that is a version, edition, or adaptation of the described Dataset."
    nl: "Een andere dataset welke een versie, editie of aanpassing van deze dataset is."
healthTheme:
  text:
    en: "A category of the Dataset or tag describing the Dataset. This could include, for example, the specific disease the dataset is about. "
    nl: "Een gezondheidsthema dat van toepassing is op deze dataset."
identifier:
  text:
    en: "The main identifier for the Dataset."
    nl: "De identifier voor de dataset."
inSeries:
  text:
    en: "A Dataset series of which the dataset is part. A Dataset Series is a collection of similar datasets that are somehow interrelated but published separately. Examples are consecutive datasets split by year and/or datasets separated by location."
    nl: "Een dataset-reeks waar deze dataset deel van uitmaakt. Een dataset-reeks is een verzameling van vergelijkbare datasets die aan elkaar verbonden zijn, maar afzonderlijk gepubliceerd worden, bijv. opeenvolgende datasets gesplitst per jaar of datasets gescheiden op locatie."
isReferencedBy:
  text:
    en: "A related resource, such as a publication, that references, cites, or otherwise points to the Dataset."
    nl: "Een andere bron, zoals een publicatie, die naar deze dataset verwijst."
keywords:
  text:
    en: "A keyword or tag describing the Dataset."
    nl: "Een trefwoord of tag die de dataset beschrijft."
languages:
  text:
    en: "A language of the Dataset."
    nl: "De taal van de dataset."
legalBasis:
  text:
    en: "The legal basis for initial collection and processing of (personal) data (e.g. Consent, Contract, Legal Obligation, Legitimate Interest, Vital Interest)"
    nl: "De juridische grondslag voor de initiële verzameling en verwerking van (persoonlijke) gegevens (bijv. Toestemming (consent), contract, wettelijke verplichting)."
maxTypicalAge:
  text:
    en: "Maximum age of the population within the Dataset, excluding outliers."
    nl: "Maximum leeftijd van de populatie in de dataset, exclusief uitschieters."
minTypicalAge:
  text:
    en: "Minimum age of the population within the Dataset, excluding outliers."
    nl: "Minimum leeftijd van de populatie in de dataset, exclusief uitschieters."
modifiedAt:
  text:
    en: "The latest date on which the Dataset was changed."
    nl: "De meest recente datum waarop de Dataset is gewijzigd."
numberOfRecords:
  text:
    en: "The total number of records in the Dataset."
    nl: "Het totale aantal records in de Dataset."
numberOfUniqueIndividuals:
  text:
    en: "The number of unique individuals represented in the Dataset"
    nl: "Het aantal unieke individuen dat in de dataset vertegenwoordigd is."
alternateIdentifier:
  text:
    en: "A alternative identifier for a dataset"
    nl: "Een alternatieve identifier voor de dataset."
personalData:
  text:
    en: "The categories of personal information that are collected in the Dataset (e.g. Gender, Age, Country Of Birth, or Health History)"
    nl: "De categorieën van persoonlijke informatie die in de Dataset zijn verzameld (bijv. geslacht, leeftijd, geboorteland, of medische voorgeschiedenis)."
populationCoverage:
  text:
    en: "A free text description of the population covered in the Dataset."
    nl: "Vrije-tekstbeschrijving van de populatie die in de dataset is opgenomen"
publishers:
  text:
    en: "An entity responsible for making the Dataset available."
    nl: "De organisatie verantwoordelijk voor het beschikbaar stellen van de dataset."
purpose:
  text:
    en: "The intended purpose for creating the Dataset (e.g. Research, Public Benefit, or Commercial Use)."
    nl: "Het beoogde doel van intiele verzameling van (persoonlijke) data."
qualifiedAttribution:
  text:
    en: "An Agent having some form of responsibility for the resource. This is where, for example, the Principal Investigator or Funder is specified."
    nl: "Een organisatie of individu met een bepaalde rol m.b.t. de dataset, bijv. de PI of subsidieverstrekker."
qualifiedRelation:
  text:
    en: "Link to a description of a relationship with another resource, for example, another Dataset."
    nl: "Link naar een andere dataset met een specifieke relatie tot deze dataset."
qualityAnnotation:
  text:
    en: "A statement related to quality of the Dataset, including rating, quality certificate, feedback that can be associated to the dataset."
    nl: "Een verklaring van de kwaliteit van de dataset."
createdAt:
  text:
    en: "The date of formal issuance (e.g.: publication) of the Dataset."
    nl: "Datum van formele uitgifte (bijv. publicatie) van de dataset."
retentionPeriod:
  text:
    en: "A temporal period in which the dataset is available for secondary use."
    nl: "De tijdsperiode waarin deze dataset beschikbaar is voor secundair gebruik."
samples:
  text:
    en: "A sample distribution of the dataset, which can be anonymized or synthetic data."
    nl: "Een distributie van een steekproef van de data. Dit kan geanonimiseerde of synthetische data zijn."
temporalCoverage:
  text:
    en: "The start and end date (if applicable) of the period(s) that the dataset covers."
    nl: "De start- en einddatum (indien van toepassing) van de periode(s) die de dataset dekt."
temporalResolution:
  text:
    en: "The smallest time interval represented in the dataset. For example, a dataset with daily observations has a temporal resolution of one day."
    nl: "Het kleinste tijdsinterval dat in de dataset weergegeven wordt. Een dataset met dagelijkse observaties heeft een temporaire resolutie van één dag."
themes:
  text:
    en: "The main category of the Dataset."
    nl: "De hoofdcategorie van de dataset."
dcatType:
  text:
    en: "Broader type of data included in the dataset."
    nl: "Het type data in de dataset, in brede zin."
version:
  text:
    en: "The version indicator (name or identifier) of the Dataset."
    nl: "Versieaanduiding van de dataset."
versionNotes:
  text:
    en: "A description of changes between this version and the previous version of the Dataset."
    nl: "Beschrijving van de wijzigingen tussen de vorige versie en deze versie van de dataset."
provenanceActivity:
  text:
    en: "An activity that generated the creation of the Dataset. Examples include Clinical Trial, Medical Registry, Cohort, Biobank Collection etc."
    nl: "De activiteit(en) waardoor deze dataset tot stand gekomen is, bijv. een klinische studie, een cohort of een biobankverzameling."

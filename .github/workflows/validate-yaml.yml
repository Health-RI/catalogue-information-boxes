name: Validate help-text YAML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate filters.yaml and detail-view.yaml
        run: yamllint -d relaxed filters.yaml detail-view.yaml

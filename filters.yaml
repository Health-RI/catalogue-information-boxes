# Dummy help text for the information icons shown next to search filters in the
# GDI User Portal frontend. Content here is placeholder only — see README.md in
# this folder for how this file is consumed and where the real copy should come
# from. Loaded by the Discovery Service's YamlHelpTextLoader when
# `helptext.filters-source` is configured (local file path or http(s) URL).
#
# Shape per key:
#   <key>:
#     text:                  # required, per language (falls back to "en")
#       en: "..."
#       nl: "..."
#     link:                  # optional; omit entirely if there is no link
#       label: ...           # see accepted shapes below
#       value:               # required if "link" is present; always a list
#         - "https://example.com"
#
# `link.label` is always keyed by language code (falls back to "en"); each
# language's value may be a single string or a list of strings:
#   - a language-code map to a single string:
#       label:
#         en: "More info"
#         nl: "Meer info"
#   - a language-code map to a list of strings:
#       label:
#         en: ["More info", "Even more info"]
#         nl: ["Meer info", "Nog meer info"]
# `link.value` is always a plain list of URLs (no language variants).
# If, once resolved for a language, `label` and `value` differ in length, the
# shorter one is padded automatically with a dummy entry ("More info" / "#").
#
# Keys are the configured filter facet keys (the `KEY` values in
# scripts/aca-deploy-discovery.sh's DATASETS_FILTER_GROUPS). Where a filter key
# doesn't match its human-facing label, the label is noted inline:
#   - issued                        -> "release date"
#   - modified                      -> "modification date"
#   - typical_age                   -> "typical age" (range: min/max_typical_age)
#   - alternate_identifier          -> "other identifier"
#   - tags                          -> "keyword"
#   - vocab_in_series_title         -> "in series"
#   - vocab_qualified_attribution_role       -> "qualified attribution role"
#   - vocab_qualified_attribution_agent_name -> "qualified attribution agent name"

